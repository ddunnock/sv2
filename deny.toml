# Dependency, license, source, and layering policy for `cargo deny check`.
# STD-002-RS §13.5.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Air-gapped builds use a mirrored advisory database (§12 rule 4). Point `db-urls` at
# the mirror there, and record the date of its last refresh in the build log.
ignore = []                       # every entry needs an advisory ID and a dated reason

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }       # workspace crates are publish = false
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    # is_ci, reached through miette's `fancy` feature in sv2-cli. ISC is
    # OSI-approved and permissive.
    "ISC",
]                                 # permissive licences only, as the project is MIT

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true       # workspace path dependencies carry no version
deny = [
    # §2.5 layering: each entry lists the only crates that may depend on it directly.
    #
    #   sv2-cli        binary: the sv2 batch command
    #   sv2-studio     binary: the Tauri shell hosting the webview and the editor
    #   sv2-wasm       cdylib: the CodeMirror adapter, loaded BY the webview
    #   sv2-resolve    libraries, names, derived properties, constraints
    #   sv2-hir        desugaring and implied specialization
    #   sv2-ast        typed accessors over the CST; owns no data
    #   sv2-syntax     core: lossless CST, no I/O
    #
    # Each layer may reach any layer below it, never one above. The hir/resolve
    # boundary is provisional (state.json, pending decision "crate-split"); moving it
    # changes these lists, and the diff here is where that is reviewed.
    { crate = "sv2-syntax", wrappers = ["sv2-ast", "sv2-hir", "sv2-resolve", "sv2-cli", "sv2-studio", "sv2-wasm"] },
    { crate = "sv2-ast", wrappers = ["sv2-hir", "sv2-resolve", "sv2-cli", "sv2-studio"] },
    { crate = "sv2-hir", wrappers = ["sv2-resolve", "sv2-cli", "sv2-studio"] },
    { crate = "sv2-resolve", wrappers = ["sv2-cli", "sv2-studio"] },

    # sv2-wasm has no entry, and the omission is the point: nothing in the workspace
    # may depend on it, which cargo-deny cannot express. An empty wrapper list bans the
    # crate outright and fails on the crate's own existence. The rule is checked by
    # scripts/check_rust_workspace.py instead. What IS enforced here is the direction
    # that matters — sv2-wasm is absent from every list above except sv2-syntax's, so a
    # dependency from the webview adapter on the resolver fails this check
    # (ADR-0013 RISK-013-4).

    # §7.1 and §8.3: binary-only crates
    { crate = "anyhow", wrappers = ["sv2-cli"] },
    { crate = "tracing-subscriber", wrappers = ["sv2-cli"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
