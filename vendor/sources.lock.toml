# ---------------------------------------------------------------------------
# Tier C — the corpus: files a conformant tool accepts.
#
# 310 model files from SysML-v2-Release at the commit behind release tag
# 2026-08, plus the informative Simple Vehicle Model from OMG. Pinned separately
# from the grammar because a corpus can grow without the language changing.
#
# Three trees, all treated as positive cases:
#   kerml/src/examples      KerML examples
#   sysml/src/examples      SysML examples
#   sysml/src/training      the training model set
#   sysml/src/validation    the validation SCENARIO set — named for modelling
#                           scenarios (Parts Tree, Requirements, Verification),
#                           not for rule violations. These are models that must
#                           parse, not negative cases.
#
# There is no negative corpus here and there cannot be: tests/rejection/ is
# hand-written, one case per rule violated, each citing the clause it breaks
# (.claude/rules/tests.md). A positive-only sweep is passed by a parser that
# accepts everything, so these files alone do not establish acceptance.
#
# NOT vendored: sysml.library/ — see INCLUDE in the generator. The library is
# Tier A, inside the KPAR archives.
# ---------------------------------------------------------------------------

