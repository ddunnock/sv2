# The pinned vendor set.
#
# Every file this workspace treats as an input is listed here with the URL it came
# from and the sha256 of the exact bytes. `sha256 = "UNPINNED"` means "fetch it and
# record whatever arrives"; `scripts/vendor_sync.py` writes the digest back into this
# file. After that, a changed hash is upstream drift and stops the sync.
#
#   python3.11 scripts/vendor_sync.py                fetch missing, verify pinned
#   python3.11 scripts/vendor_sync.py --accept-new   a reviewed upgrade
#   python3.11 scripts/vendor_verify.py              offline check; the gate runs this
#
# Tiers are ADR-0010. The versions are docs/conformance-target.toml; this file is
# the bytes. Nothing here is editable by an agent — the PreToolUse hook blocks it.

