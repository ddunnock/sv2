[package]
name = "sv2-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Work counters for the performance probe (ADR-0024). Off in every shipped build.
counters = []

[dependencies]
rowan = { workspace = true }
text-size = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
divan = { workspace = true }
stats_alloc = { workspace = true }

# Not for WASI: proptest's process forking (wait-timeout) has no WASI implementation, and
# nothing that uses it runs there. The one dev target built for WASI is perf_probe, which
# times the parser under WebAssembly engines (ADR-0024; docs/perf/roadmap.md Phase 1).
[target.'cfg(not(target_os = "wasi"))'.dev-dependencies]
proptest = { workspace = true }

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
